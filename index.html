<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcelona Restaurant Finder</title>
    <link rel="stylesheet" href="css/style.css">
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initMap"></script>
</head>
<body>
    <div id="location-status">Buscando tu ubicación...</div>

    <div id="filters-container">
        <label for="food-type-select">Selecciona el tipo de comida:</label>
        <select id="food-type-select" name="food-type">
            <option value="">Todos los tipos</option>
            <option value="italian">Italiana</option>
            <option value="spanish">Española</option>
            <option value="japanese">Japonesa</option>
            <option value="mexican">Mexicana</option>
            <option value="indian">India</option>
        </select>

        <label for="zone-select">¿En qué zona de Barcelona estás?:</label>
        <select id="zone-select" name="zone">
            <option value="">Todas las zonas</option>
            <option value="gothic_quarter">Barrio Gótico</option>
            <option value="eixample">Eixample</option>
            <option value="gracia">Gràcia</option>
            <option value="barceloneta">Barceloneta</option>
        </select>

        <span id="search-icon" style="font-size: 24px; cursor: pointer; padding: 5px; vertical-align: middle;">🔍</span>
        <input type="text" id="search-input" placeholder="Busca tu próximo restaurante favorito..." style="display: none;">
    </div>

    <div id="map"></div>
    <div id="restaurant-details-container" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #ccc;">
        <h3 id="detail-name"></h3>
        <p id="detail-rating"></p>
        <p id="detail-address"></p>
        <button id="get-directions-button" style="margin-top: 10px;">Obtener Dirección</button>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
